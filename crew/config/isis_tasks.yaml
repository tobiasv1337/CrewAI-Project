isis_course_info_task:
  description: >
    Answer the student's ISIS/Moodle course-information question using only the
    ISIS tools.

    Student question:
    {query}

    Optional student context supplied by the application:
    {student_context}

    Structured MOSES-to-ISIS handoff context, if available. This may include
    `grade_manager_course_scope`, which is the default source of truth for
    which courses the student is actually taking or planning in the requested
    semester:
    {isis_context}

    Tool routing rules:
    - Decide from the full student question which of these cases applies.
      Do not rely on raw keyword matching; use the query, conversation context,
      and Grade Manager scope together.
    - Follow this precedence after interpreting the user's intent:
      1. If the user directly names an ISIS course, ISIS course ID, or ISIS
         course URL, answer that specific course after validation. Mention if
         it is outside the Grade Manager scope.
      2. If the user explicitly asks for all ISIS/Moodle courses in the
         requested term, you may inspect enrolled ISIS courses and filter them
         to `grade_manager_course_scope.requested_term`.
      3. Otherwise, default to the Grade Manager scoped modules in
         `grade_manager_course_scope.scope_modules`. Answer only for those
         In Progress/Planned modules in the requested term.
    - Use resolved ISIS course_id candidates from the Grade Manager scoped
      modules first when the context provides them.
    - Do not interpret MOSES module numbers, MOSES course numbers, or lvvid
      values as ISIS course IDs.
    - If no scoped course_id is known, use the scoped module titles and fallback
      search terms to resolve the matching ISIS courses. You may inspect
      already enrolled ISIS courses to resolve those scoped courses, but do not
      broaden a normal current-course answer to every enrolled ISIS course.
    - If the Grade Manager scope has no matching modules and the user did not
      explicitly request a direct ISIS course or all ISIS courses, say that no
      Grade Manager active/planned courses matched the requested term and ask
      for a course or term clarification.
    - If a course name/query is ambiguous, list the candidates and ask for the
      missing discriminator instead of guessing.
    - Use the smallest specific read tool that answers the question:
      announcements for announcements, forums for forum discussions,
      assignments for homework/deadlines, grades for grades, calendar events
      for Moodle calendar dates, materials for resources/pages/folders/URLs,
      assessments for quizzes/workshops/feedback/choices, and date extraction
      for dates embedded in text.
    - Temporary enrollment is controlled by the runtime tool configuration, not
      by you. Never claim to enable it through tool arguments.
    - Never post to forums, submit assignments, send messages, mark activities
      complete, unenroll existing courses, or edit course data.

    Response language:
    - You MUST write your entire response in {language}.
  expected_output: >
    A concise markdown answer grounded in ISIS tool results. Include verified
    ISIS course IDs/titles when course-specific data was used, concrete dates
    and deadlines when found, ambiguity or access limitations when relevant,
    and a clear next step when more course disambiguation or user confirmation
    is required.
  agent: course_info_specialist
