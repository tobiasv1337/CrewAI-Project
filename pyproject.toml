[project]
name = "tu-notenmanager"
version = "0.1.0"
description = "Interaktives Python-Tool zur Planung, Verwaltung und Berechnung von Abschlussnoten"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.56.0",
    "pydantic",
    "pandas",
    "plotly",
    "matplotlib",
    "beautifulsoup4",
    "pytest",
    "crewai",
    "crewai-tools",
    "playwright",
    "requests",
    "python-dotenv",
    "markdown-it-py>=4.2.0",
    "reportlab>=4.4,<5",
]

[tool.pytest.ini_options]
pythonpath = "."
markers = [
    "live_llm: opt-in live CrewAI runs that require RUN_LIVE_CREW_TESTS=1 and GWDG_API_KEY",
]
