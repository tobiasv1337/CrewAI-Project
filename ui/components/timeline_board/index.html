<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline Board</title>
    <style>
      :root {
        color-scheme: light;
        font-family: 'Source Sans 3', 'Source Sans Pro', 'Segoe UI', sans-serif;
        --ink: #0f172a;
        --ink-secondary: #334155;
        --muted: #64748b;
        --muted-light: #94a3b8;
        --border: #e2e8f0;
        --border-subtle: rgba(226, 232, 240, 0.85);
        --surface: #ffffff;
        --surface-2: #f1f5f9;
        --surface-3: #f8fafc;
        --brand: #e52e3f;
        --brand-soft: rgba(229, 46, 63, 0.10);
        --teal: #0f766e;
        --amber: #c2410c;
        --danger: #dc2626;
        --success: #15803d;
        --shadow-sm: 0 6px 18px rgba(15, 23, 42, 0.06);
        --shadow-md: 0 16px 30px rgba(15, 23, 42, 0.10);
        --term-shadow: 0 18px 40px -34px rgba(15, 23, 42, 0.22), 0 8px 16px -14px rgba(15, 23, 42, 0.08);
        --module-shadow-rest: 0 18px 34px -28px rgba(15, 23, 42, 0.30), 0 8px 16px -14px rgba(15, 23, 42, 0.12);
        --module-shadow-hover: 0 26px 42px -30px rgba(15, 23, 42, 0.34), 0 12px 20px -16px rgba(15, 23, 42, 0.15);
        --module-shadow-candidate: 0 14px 30px -28px rgba(15, 23, 42, 0.22), 0 6px 12px -12px rgba(15, 23, 42, 0.10);
        --radius-card: 14px;
        --radius-inset: 10px;
        --surface-glass: rgba(255, 255, 255, 0.96);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --ink: #f3f3f5;
        --ink-secondary: #cbd5e1;
        --muted: #8a8a93;
        --muted-light: #64646b;
        --border: #2d2d34;
        --border-subtle: rgba(45, 45, 52, 0.85);
        --surface: #1e1e24;
        --surface-2: #16161a;
        --surface-3: #121214;
        --brand: #e52e3f; /* TU Berlin brand red */
        --brand-soft: rgba(229, 46, 63, 0.15);
        --shadow-sm: 0 6px 18px rgba(0, 0, 0, 0.25);
        --shadow-md: 0 16px 30px rgba(0, 0, 0, 0.35);
        --term-shadow: 0 18px 40px -34px rgba(0, 0, 0, 0.5), 0 8px 16px -14px rgba(0, 0, 0, 0.3);
        --module-shadow-rest: 0 18px 34px -28px rgba(0, 0, 0, 0.6), 0 8px 16px -14px rgba(0, 0, 0, 0.4);
        --module-shadow-hover: 0 26px 42px -30px rgba(0, 0, 0, 0.7), 0 12px 20px -16px rgba(0, 0, 0, 0.5);
        --module-shadow-candidate: 0 14px 30px -28px rgba(0, 0, 0, 0.4), 0 6px 12px -12px rgba(0, 0, 0, 0.2);
        --surface-glass: rgba(30, 30, 36, 0.96);
      }

      * { box-sizing: border-box; }
      body { margin: 0; background: var(--surface-3); color: var(--ink); }
      button { font: inherit; }

      /* ── Main layout ───────────────────────────────── */
      .board-wrapper {
        position: relative;
        min-height: 200px;
      }

      .board-layout {
        position: relative;
      }

      .lanes-area {
        display: grid;
        gap: 0.85rem;
        padding: 0.25rem 0;
      }

      /* ── Semester card ─────────────────────────────── */
      .term-card {
        display: grid;
        grid-template-columns: minmax(155px, 195px) 1fr;
        gap: 1rem;
        padding: 1rem;
        border-radius: var(--radius-card);
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: var(--term-shadow);
      }

      .term-sidebar {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      .term-header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.6rem;
      }

      .term-label {
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .term-header-actions {
        display: flex;
        gap: 0.35rem;
        flex-wrap: nowrap;
        justify-content: flex-start;
      }

      .term-action-btn {
        border: 1px solid rgba(148, 163, 184, 0.55);
        background: var(--surface-3);
        color: var(--ink-secondary);
        border-radius: 999px;
        padding: 0.18rem 0.55rem;
        font-size: 0.68rem;
        font-weight: 700;
        cursor: pointer;
      }

      .term-action-btn:hover {
        background: var(--surface-2);
        border-color: rgba(100, 116, 139, 0.65);
      }

      .term-action-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .term-meta {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.15rem;
      }

      .term-meta-candidate { color: var(--muted-light); }
      .term-meta-additional { color: var(--muted); }

      /* ── Drop zone ─────────────────────────────────── */
      .term-dropzone {
        min-height: 110px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 0.85rem;
        padding: 0.3rem;
        border-radius: var(--radius-inset);
        transition: background 0.15s ease, box-shadow 0.15s ease;
      }

      .term-dropzone.is-active-valid {
        background: rgba(229, 46, 63, 0.06);
        box-shadow: inset 0 0 0 2px rgba(229, 46, 63, 0.22);
      }

      .term-dropzone.is-active-invalid {
        background: rgba(220, 38, 38, 0.05);
        box-shadow: inset 0 0 0 2px rgba(220, 38, 38, 0.18);
      }

      .term-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 80px;
        padding: 0.8rem;
        border: 1px dashed rgba(148, 163, 184, 0.42);
        border-radius: var(--radius-inset);
        color: var(--muted);
        font-size: 0.86rem;
        text-align: center;
        background: var(--surface-3);
      }

      /* ── Module card ───────────────────────────────── */
      .module-card {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 136px;
        padding: 1.12rem 1rem 1rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
        box-shadow: var(--module-shadow-rest);
        text-align: left;
        cursor: grab;
        text-decoration: none;
        color: var(--ink);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .module-card:hover {
        border-color: rgba(71, 85, 105, 0.30);
        box-shadow: var(--module-shadow-hover);
        transform: translateY(-2px);
      }

      .module-card.is-selected {
        border-color: rgba(229, 46, 63, 0.42);
        box-shadow: 0 0 0 3px rgba(229, 46, 63, 0.08), var(--module-shadow-hover);
      }

      /* Greyed-out Possible Candidate style */
      .module-card.is-candidate {
        background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
        border-color: rgba(148, 163, 184, 0.44);
        box-shadow: var(--module-shadow-candidate);
      }

      .module-card.is-candidate .module-accent-bar {
        background: #b0bec5 !important;
      }

      .module-card.is-candidate .module-title,
      .module-card.is-candidate .module-subtitle {
        color: var(--muted);
      }

      .module-card.is-candidate:hover {
        border-color: rgba(100, 116, 139, 0.55);
        box-shadow: var(--module-shadow-rest);
        transform: translateY(-1px);
      }

      .module-card.is-candidate.is-selected {
        border-color: rgba(100, 116, 139, 0.65);
        background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface-3) 100%);
        box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.10), var(--module-shadow-rest);
      }

      .module-card.is-dragging {
        opacity: 0.45;
        transform: rotate(1.5deg) scale(0.97);
        cursor: grabbing;
      }

      /* Horizontal accent bar at top (area color) */
      .module-accent-bar {
        flex: 0 0 auto;
        height: 6px;
        border-radius: 999px;
        margin-bottom: 0.78rem;
        background: var(--area-color, var(--muted));
      }

      /* Vertical left bar (program/degree color) */
      .module-program-bar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        border-radius: var(--radius-card) 0 0 var(--radius-card);
        background: var(--program-color, transparent);
      }

      .module-title {
        font-weight: 600;
        font-size: 1rem;
        line-height: 1.22;
        margin-bottom: 0.38rem;
        padding-right: 1.2rem;
      }

      .module-subtitle {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.65rem;
        font-weight: 500;
      }

      .module-meta {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-width: 0;
      }

      /* Group pills by row */
      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .module-menu-hint {
        position: absolute;
        top: 0.98rem;
        right: 0.82rem;
        color: var(--muted-light);
        font-size: 1rem;
        line-height: 1;
        opacity: 0.5;
        transition: opacity 0.15s;
      }

      .module-card:hover .module-menu-hint { opacity: 1; }

      /* ── Pills (matching original course-pill style) ─── */
      .pill {
        display: inline-flex;
        align-items: center;
        padding: 0.18rem 0.6rem;
        border-radius: 999px;
        font-size: 0.69rem;
        font-weight: 550;
        line-height: 1.35;
        border: 1px solid var(--border);
        color: var(--muted);
        background: var(--surface-2);
        white-space: nowrap;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pill-solid {
        background: #1e293b;
        color: #f1f5f9;
        border-color: #334155;
      }

      .pill-status {
        border-color: var(--pill-color, var(--muted));
        color: var(--pill-color, var(--muted));
        background: var(--surface-2);
      }

      .pill-candidate {
        background: rgba(100, 116, 139, 0.10);
        border-color: rgba(100, 116, 139, 0.32);
        color: #475569;
      }

      .pill-grade {
        background: rgba(15, 23, 42, 0.045);
        border-color: rgba(148, 163, 184, 0.55);
        color: rgba(15, 23, 42, 0.92);
      }

      .pill-pass {
        border-color: rgba(22, 163, 74, 0.28);
        background: rgba(22, 163, 74, 0.10);
        color: var(--success);
      }

      .pill-outline {
        background: transparent;
        border-color: rgba(229, 46, 63, 0.35);
        color: var(--brand);
      }

      .pill-muted {
        background: #f1f5f9;
        border-color: #e2e8f0;
        color: #475569;
      }

      .pill-default { border-color: rgba(15, 23, 42, 0.12); }

      /* ── Dark mode pill overrides ───────────────────── */
      :root[data-theme="dark"] .pill-solid {
        background: #374151;
        color: #f9fafb;
        border-color: #4b5563;
      }

      :root[data-theme="dark"] .pill-candidate {
        background: rgba(100, 116, 139, 0.18);
        border-color: rgba(100, 116, 139, 0.40);
        color: #94a3b8;
      }

      :root[data-theme="dark"] .pill-grade {
        background: rgba(243, 243, 245, 0.06);
        border-color: rgba(148, 163, 184, 0.30);
        color: rgba(243, 243, 245, 0.88);
      }

      :root[data-theme="dark"] .pill-program-other {
        background: rgba(243, 243, 245, 0.05);
        border-color: rgba(148, 163, 184, 0.30);
        color: rgba(243, 243, 245, 0.75);
      }

      :root[data-theme="dark"] .pill-muted {
        background: rgba(100, 116, 139, 0.15);
        border-color: rgba(100, 116, 139, 0.30);
        color: #8a8a93;
      }

      :root[data-theme="dark"] .pill-default {
        border-color: rgba(243, 243, 245, 0.12);
      }

      .pill-program-msc {
        background: rgba(190, 18, 60, 0.10);
        border-color: rgba(190, 18, 60, 0.30);
        color: #be123c;
      }

      .pill-program-bsc {
        background: rgba(229, 46, 63, 0.10);
        border-color: rgba(229, 46, 63, 0.30);
        color: var(--brand);
      }

      .pill-program-other {
        background: rgba(15, 23, 42, 0.03);
        border-color: rgba(148, 163, 184, 0.55);
        color: rgba(15, 23, 42, 0.9);
      }

      .pill-tag-tutor {
        background: rgba(220, 38, 38, 0.10);
        border-color: rgba(220, 38, 38, 0.30);
        color: #b91c1c;
      }

      .pill-offering-both {
        border-color: rgba(15, 118, 110, 0.22);
        background: rgba(15, 118, 110, 0.06);
        color: var(--teal);
      }

      .pill-offering-ws {
        border-color: rgba(229, 46, 63, 0.22);
        background: rgba(229, 46, 63, 0.06);
        color: var(--brand);
      }

      .pill-offering-ss {
        border-color: rgba(192, 65, 12, 0.22);
        background: rgba(192, 65, 12, 0.06);
        color: var(--amber);
      }

      .pill-forecast-counted {
        border-color: rgba(220, 38, 38, 0.30);
        background: rgba(220, 38, 38, 0.08);
        color: var(--danger);
      }

      .pill-forecast-discarded {
        border-color: rgba(15, 118, 110, 0.28);
        background: rgba(15, 118, 110, 0.08);
        color: var(--teal);
      }

      .pill-forecast-protected {
        border-color: rgba(229, 46, 63, 0.30);
        background: rgba(229, 46, 63, 0.08);
        color: var(--brand);
      }

      .pill-forecast-differs {
        border-color: rgba(192, 65, 12, 0.30);
        background: rgba(192, 65, 12, 0.08);
        color: var(--amber);
      }

      .pill-forecast-muted {
        border-color: rgba(100, 116, 139, 0.24);
        background: rgba(100, 116, 139, 0.08);
        color: var(--muted);
      }

      /* ── Shelf drop proxy (right edge of board) ───── */
      .shelf-drop-edge {
        position: absolute;
        right: -4px;
        top: 0;
        bottom: 0;
        width: 48px;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0 var(--radius-card) var(--radius-card) 0;
        transition: background 0.15s, box-shadow 0.15s;
      }

      .shelf-drop-edge.is-drag-hover {
        background: rgba(229, 46, 63, 0.08);
        box-shadow: inset -3px 0 0 rgba(229, 46, 63, 0.35);
      }

      .shelf-drop-edge-label {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: transparent;
        user-select: none;
        transition: color 0.15s;
      }

      .shelf-drop-edge.is-drag-hover .shelf-drop-edge-label {
        color: var(--brand);
      }

      .context-menu {
        position: fixed;
        z-index: 40;
        min-width: 220px;
        max-width: min(340px, calc(100vw - 24px));
        padding: 0.4rem;
        border-radius: var(--radius-card);
        border: 1px solid var(--border);
        background: var(--surface-glass);
        box-shadow: 0 20px 45px -20px rgba(15, 23, 42, 0.35);
        backdrop-filter: blur(8px);
      }

      .context-menu[hidden] { display: none; }

      .context-title {
        padding: 0.4rem 0.5rem 0.25rem;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .context-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 0.5rem 0.58rem;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
        font-size: 0.88rem;
      }

      .context-button:hover { background: var(--surface-2); }

      .context-button.is-current {
        background: var(--brand-soft);
        color: var(--brand);
        font-weight: 700;
      }

      .context-divider {
        height: 1px;
        margin: 0.3rem 0.2rem;
        background: var(--border-subtle);
      }

      .context-secondary {
        color: var(--muted);
        font-size: 0.72rem;
      }

      /* ── Responsive ────────────────────────────────── */
      @media (max-width: 820px) {
        .term-card { grid-template-columns: 1fr; }
        .term-dropzone { grid-template-columns: 1fr; }
      }

      :root {--shadow-sm:none;--module-shadow-rest:none;--module-shadow-candidate:none;--term-shadow:none;--blue:#306bc4}
      :root[data-theme="dark"] {--surface:#1d2129;--surface-2:#252a34;--surface-3:#14171d;--border:#343b47;--border-subtle:#343b47;--muted:#adb5c4;--muted-light:#adb5c4;--blue:#8cb7ff;--success:#72cfaa;--brand:#f09aab;--brand-soft:rgba(240,154,171,.1)}
      .term-card {box-shadow:none!important;background:var(--surface-3)!important;background-image:none!important;border:1px solid var(--border)}
      .board-wrapper,.board-layout,.lanes-area {background:var(--surface-3)!important;background-image:none!important}
      .term-card.is-current {border-color:color-mix(in srgb,var(--brand) 60%,var(--border));box-shadow:0 0 0 1px color-mix(in srgb,var(--brand) 10%,transparent),0 0 12px color-mix(in srgb,var(--brand) 7%,transparent)!important}
      .term-current-label {font-size:.75rem;font-weight:600;color:var(--brand)}
      .module-card {box-shadow:none!important;padding:1rem;border-radius:12px;min-height:0}
      .module-card:hover {transform:none}
      .module-card.is-candidate, .module-card.is-candidate.is-selected {background:var(--surface);border-style:dashed}
      .module-card.is-candidate .module-title {color:var(--ink)}
      .module-accent-bar {height:3px;margin-bottom:.8rem;width:2rem}
      .module-menu-hint {display:flex;align-items:center;justify-content:center;opacity:1;top:.4rem;right:.3rem;width:40px;height:40px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;font-size:1.4rem}
      .module-title {line-height:1.4;padding-right:1.5rem;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
      .module-full-name {line-height:1.45;padding:.5rem 0;color:var(--ink)}
      .module-more {margin-top:.35rem;font-size:.8rem;color:var(--muted)}
      .module-more summary {cursor:pointer;padding:.4rem 0;min-height:32px}
      .module-more[open] .pill-row {margin-top:.4rem}
      .pill {font-size:.75rem;padding:.2rem .45rem;border-radius:6px}
      .pill-outline {color:var(--muted);border-color:var(--border);background:transparent}
      .pill-solid {background:var(--surface-2);color:var(--ink);border-color:transparent}
      .pill-state-completed {--pill-color:var(--success)!important}
      .pill-state-in-progress {--pill-color:var(--blue)!important}
      .pill-state-planned {--pill-color:var(--muted)!important}
      .pill-program-bsc {color:var(--blue)!important;background:color-mix(in srgb,var(--blue) 10%,transparent)!important;border-color:color-mix(in srgb,var(--blue) 25%,transparent)!important}
      .pill-program-msc {color:var(--brand)!important;background:var(--brand-soft)!important;border-color:color-mix(in srgb,var(--brand) 25%,transparent)!important}
      .context-menu {max-width:calc(100vw - 24px);max-height:80vh;overflow:auto;border-color:var(--border)}
      .context-menu select {margin:.4rem .6rem;width:calc(100% - 1.2rem);padding:.65rem;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:8px;font:inherit}
      .context-button {min-height:44px}
      :focus-visible {outline:2px solid var(--blue);outline-offset:2px}
      @media(max-width:600px) {.term-dropzone{grid-template-columns:minmax(0,1fr)!important;padding:.75rem}.term-sidebar{padding:1rem}.module-card{touch-action:pan-y}.module-more summary{min-height:40px}}
      @media(prefers-reduced-motion:reduce) {*{transition:none!important;animation:none!important}}

      /* Preserve meaningful course hierarchy from the original planner. */
      .module-card {box-shadow:0 2px 5px rgba(15,23,42,.06)!important;transition:border-color .18s,box-shadow .18s,transform .18s}
      .module-card:hover {box-shadow:0 8px 18px rgba(15,23,42,.1)!important;transform:translateY(-1px)}
      .module-card.is-candidate,.module-card.is-candidate.is-selected {background:linear-gradient(160deg,var(--surface-2),var(--surface-3));border-style:solid;box-shadow:none!important}
      .module-card.is-candidate .module-title,.module-card.is-candidate .module-subtitle {color:var(--muted)!important}
      .module-card.is-candidate .module-program-bar,.module-card.is-candidate .module-accent-bar {background:#97a3af!important}
      .module-card.state-completed .module-program-bar {background:var(--success)}
      .module-card.state-in-progress .module-program-bar {background:var(--blue)}
      .module-card.state-planned .module-program-bar {background:var(--ink-secondary)}
      .module-accent-bar {width:calc(100% - 1.7rem);height:6px;margin-bottom:.85rem}
      .module-title {display:block;-webkit-line-clamp:unset;overflow:visible;overflow-wrap:anywhere}
      .pill {border-radius:999px;white-space:normal;overflow:visible;text-overflow:clip;font-size:.73rem;padding:.2rem .55rem;line-height:1.4}
      .pill-solid {background:#202b3d!important;color:#fff!important;border-color:#202b3d!important;font-weight:650}
      .pill-outline {color:var(--blue);border-color:color-mix(in srgb,var(--blue) 35%,transparent);background:color-mix(in srgb,var(--blue) 3%,transparent)}
      .pill-candidate {color:var(--muted);background:color-mix(in srgb,var(--muted) 9%,transparent)}
      .context-menu {width:330px;background:var(--surface);padding:.65rem;box-shadow:0 14px 45px rgba(0,0,0,.2);backdrop-filter:none}
      .context-heading {display:flex;align-items:center;justify-content:space-between;padding:0 .35rem;font-size:.95rem}
      .context-course-name {font-size:.78rem;line-height:1.4;color:var(--muted);margin:0 .35rem .5rem;max-height:3.4em;overflow:auto}
      .context-close {background:transparent;border:0;color:var(--muted);font-size:1.4rem;width:36px;height:36px;border-radius:6px;cursor:pointer}
      .context-close:hover {background:var(--surface-2)}
      .context-title {display:block;font-size:.75rem;text-transform:none;letter-spacing:0;font-weight:550;padding:.6rem .4rem .2rem}
      .context-status-grid {display:grid;grid-template-columns:1fr 1fr;gap:.3rem;padding:.1rem .3rem}
      .context-status-grid .context-button {font-size:.77rem;background:var(--surface-2);border:1px solid var(--border);padding:.45rem .5rem;min-height:42px}
      .context-status-grid .context-button.is-current {background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
      .context-status-grid .context-secondary {display:none}
      .context-open {color:var(--blue);font-weight:550}

      .context-status-grid [data-value="Completed"].is-current {background:color-mix(in srgb,var(--success) 12%,var(--surface));border-color:var(--success);color:var(--success)}
      .context-status-grid [data-value="In Progress"].is-current {background:color-mix(in srgb,var(--blue) 12%,var(--surface));border-color:var(--blue);color:var(--blue)}
      .context-status-grid [data-value="Planned"].is-current,.context-status-grid [data-value="Possible Candidate"].is-current {background:var(--surface-2);border-color:var(--muted);color:var(--ink)}
      .module-accent-bar {height:4px;background:color-mix(in srgb,var(--area-color) 74%,var(--muted));margin-bottom:.85rem}
      .module-program-bar {width:3px;opacity:.78}
      .module-card.is-candidate .module-program-bar,.module-card.is-candidate .module-accent-bar {opacity:.65}
      .module-meta {gap:.5rem}
      .pill-row {gap:.3rem}
      .pill {font-weight:500;font-size:.72rem}
      .pill-solid,.pill-status,.pill-candidate,.pill-grade,.pill-pass {font-weight:600}
      .pill-source {color:var(--muted);background:transparent;border-color:var(--border)}
      .pill-catalog {color:var(--ink-secondary);background:transparent;border-color:var(--border);border-radius:7px}
      .pill-offering-both,.pill-offering-ws,.pill-offering-ss {color:var(--muted);background:var(--surface-2);border-color:var(--border)}
      .pill-muted {border-color:transparent;background:var(--surface-2);color:var(--muted)}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="context-menu" class="context-menu" role="dialog" aria-label="Course actions" hidden></div>

    <script>
      const root = document.getElementById("root");
      const contextMenu = document.getElementById("context-menu");
      let boardData = { terms: [], candidateShelf: [], states: [], summary: {} };
      let moduleIndex = {};
      let draggedModuleId = null;
      let shelfOpen = false;
      let shelfFilter = "all"; // "all" | "ws" | "ss"

      let currentTheme = null;

      function normalizeTheme(value) {
        const text = String(value || "").toLowerCase();
        if (text.includes("dark")) return "dark";
        if (text.includes("light")) return "light";
        return null;
      }

      function parentTheme() {
        try {
          const parentDoc = window.parent.document;
          const sources = [
            parentDoc.documentElement,
            parentDoc.body,
            parentDoc.querySelector(".stApp")
          ].filter(Boolean);
          for (const source of sources) {
            const theme = normalizeTheme(source.getAttribute("data-theme"));
            if (theme) return theme;
          }
        } catch (e) {
          console.warn("Could not sync theme with parent document:", e);
        }
        return null;
      }

      function applyTheme(theme) {
        if (theme !== "dark" && theme !== "light") return;
        if (currentTheme === theme) return;
        currentTheme = theme;
        document.documentElement.setAttribute("data-theme", theme);
        document.body.setAttribute("data-theme", theme);
      }

      function syncTheme(event) {
        const eventTheme = normalizeTheme(event && event.detail && event.detail.theme);
        const mediaTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        applyTheme(eventTheme || parentTheme() || mediaTheme);
      }

      // Initial theme sync
      syncTheme();

      // Parent theme observer
      try {
        const parentDoc = window.parent.document;
        const observer = new window.parent.MutationObserver(syncTheme);
        [
          parentDoc.documentElement,
          parentDoc.body,
          parentDoc.querySelector(".stApp")
        ].filter(Boolean).forEach((element) => {
          observer.observe(element, {
            attributes: true,
            attributeFilter: ["data-theme", "class", "style"]
          });
        });
        window.parent.addEventListener("tu-theme-change", syncTheme);
      } catch (e) {
        console.warn("Could not register theme observer on parent:", e);
      }

      const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");
      if (themeMedia.addEventListener) {
        themeMedia.addEventListener("change", syncTheme);
      } else if (themeMedia.addListener) {
        themeMedia.addListener(syncTheme);
      }

      /* ── Streamlit component protocol ──────────────── */
      function sendMsg(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type }, data || {}), "*"
        );
      }

      function init() {
        syncTheme();
        sendMsg("streamlit:componentReady", { apiVersion: 1 });
        updateHeight();
      }

      let lastSentHeight = 0;
      function updateHeight() {
        // Measure content, not the old iframe viewport, so collapsed terms and
        // filtered plans can shrink without leaving a large empty tail.
        const menuBottom = contextMenu && !contextMenu.hidden ? contextMenu.getBoundingClientRect().bottom : 0;
        const h = Math.ceil(Math.max(root.getBoundingClientRect().bottom, menuBottom) + 16);
        if (h !== lastSentHeight) {
          lastSentHeight = h;
          sendMsg("streamlit:setFrameHeight", { height: h });
        }
      }

      function setComponentValue(v) {
        sendMsg("streamlit:setComponentValue", { value: v });
      }

      /* ── Helpers ───────────────────────────────────── */
      function esc(v) {
        return String(v || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function attr(v) { return esc(v).replaceAll("\n", " "); }

      function makeAction(kind, extra) {
        return Object.assign({
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          kind
        }, extra || {});
      }

      function termSeason(label) {
        const v = String(label || "").trim().toUpperCase();
        if (v.startsWith("WS")) return "WS";
        if (v.startsWith("SS")) return "SS";
        return null;
      }

      function canPlace(mod, termLabel) {
        const season = termSeason(termLabel);
        if (!season || !mod) return true;
        if (!mod.offering || mod.offering === "WS & SS") return true;
        if (mod.offering === "WS only") return season === "WS";
        if (mod.offering === "SS only") return season === "SS";
        return true;
      }

      function pillCls(pill) {
        const v = pill.variant || "default";
        const state = v === 'status' ? ` pill-state-${String(pill.label || '').toLowerCase().replaceAll(' ', '-')}` : '';
        return `pill pill-${v}${state}`;
      }

      function pillStyle(pill) {
        if (pill.variant === "status" && pill.color) {
          return ` style="--pill-color:${attr(pill.color)}"`;
        }
        return "";
      }

      function groupPillsForRows(pills) {
        const groups = [[], [], [], [], []];
        for (const pill of pills || []) {
          const variant = pill.variant || 'default';
          const group = pill.group === 'topics' ? 4
            : variant === 'catalog' ? 3
            : variant.startsWith('program-') ? 1
            : ['solid', 'status', 'candidate', 'grade', 'pass'].includes(variant) || variant.startsWith('offering-') || variant.startsWith('forecast-') ? 0 : 2;
          groups[group].push(pill);
        }
        return groups.filter(group => group.length);
      }

      function renderPills(pills) {
        if (!pills || !pills.length) return '';
        const rows = groupPillsForRows(pills);
        return rows.map(row => {
          const items = row.map(p => `<span class="${pillCls(p)}"${pillStyle(p)}>${esc(p.label)}</span>`).join('');
          return `<div class="pill-row">${items}</div>`;
        }).join('');
      }

      /* ── Render: module card ───────────────────────── */
      function renderModule(mod) {
        const cls = [
          "module-card",
          mod.selected ? "is-selected" : "",
          mod.candidate ? "is-candidate" : "",
          "state-" + (mod.state || "planned").toLowerCase().replaceAll(" ", "-"),
          mod.draggable === false ? "is-locked" : ""
        ].filter(Boolean).join(" ");

        const programBar = mod.statusColor
          ? `<div class="module-program-bar" title="${attr(mod.state)}" style="--program-color:${attr(mod.statusColor)}"></div>`
          : "";

        return `
          <article tabindex="0" aria-label="${attr(mod.name)}" class="${cls}" draggable="${mod.draggable === false ? "false" : "true"}"
            data-segment-id="${attr(mod.id)}"
            data-module-id="${attr(mod.moduleId || mod.id)}"
            style="--area-color:${attr(mod.accent || '#64748b')}">
            ${programBar}
            <div class="module-accent-bar"></div>
            <div class="module-title" title="${attr(mod.name)}">${esc(mod.name)}</div>
            <button type="button" class="module-menu-hint" aria-label="Actions for ${attr(mod.name)}">⋮</button>
            <div class="module-subtitle">${esc(mod.area)}</div>
            <div class="module-meta">${renderPills(mod.pills)}</div>
          </article>
        `;
      }

      /* ── Render: semester lane ──────────────────────── */
      function renderTerm(term) {
        const modules = term.modules || [];
        const moduleHtml = modules.length
          ? modules.map(m => renderModule(m)).join("")
          : `<div class="term-empty">Drop a module here</div>`;

        const metaHtml = (term.meta || []).map(item => {
          let cls = "term-meta";
          if (item.tone === "candidate") cls += " term-meta-candidate";
          if (item.tone === "additional") cls += " term-meta-additional";
          return `<div class="${cls}">${esc(item.label)}</div>`;
        }).join("");

        const actionsHtml = term.manageable && boardData.planningMode ? `
          <div class="term-header-actions">
            <button type="button" class="term-action-btn" data-term-action="rename" data-term="${attr(term.label)}">Rename</button>
            <button type="button" class="term-action-btn" data-term-action="delete" data-term="${attr(term.label)}"${term.canDelete ? "" : " disabled"}>Delete</button>
          </div>
        ` : "";

        return `
          <section class="term-card${term.label === boardData.currentTerm ? ' is-current' : ''}">
            <div class="term-sidebar">
              <div class="term-header">
                <div class="term-label">${esc(term.label)}</div>
                ${term.label === boardData.currentTerm ? '<span class="term-current-label">Current semester</span>' : ''}
                ${actionsHtml}
              </div>
              ${metaHtml}
            </div>
            <div class="term-dropzone" data-term="${attr(term.label)}">
              ${moduleHtml}
            </div>
          </section>
        `;
      }

      /* ── Render: candidate shelf ───────────────────── */
      function filteredShelfModules() {
        const all = boardData.candidateShelf || [];
        if (shelfFilter === "ws") return all.filter(m => m.offering === "WS only" || m.offering === "WS & SS");
        if (shelfFilter === "ss") return all.filter(m => m.offering === "SS only" || m.offering === "WS & SS");
        return all;
      }

      /* ── Parent-injected shelf CSS ────────────────── */
      const SHELF_PARENT_CSS = `

      /* ── Inject shelf into parent document ──────────── */
      let parentShelfContainer = null;

      function cleanupParentShelf() {
        try {
          const pdoc = window.parent.document;
          const root = pdoc.getElementById('tl-shelf-root');
          if (root) root.remove();
          const style = pdoc.getElementById('tl-shelf-css');
          if (style) style.remove();
          parentShelfContainer = null;
        } catch (e) {
          parentShelfContainer = null;
        }
      }

      function ensureParentShelf() {
        try {
          const pdoc = window.parent.document;
          if (!pdoc) return false;
          if (!pdoc.getElementById('tl-shelf-css')) {
            const style = pdoc.createElement('style');
            style.id = 'tl-shelf-css';
            style.textContent = SHELF_PARENT_CSS;
            pdoc.head.appendChild(style);
          }
          if (!pdoc.getElementById('tl-shelf-root')) {
            const div = pdoc.createElement('div');
            div.id = 'tl-shelf-root';
            pdoc.body.appendChild(div);
          }
          parentShelfContainer = pdoc.getElementById('tl-shelf-root');
          return true;
        } catch (e) {
          return false;
        }
      }

      function renderShelfModule(mod) {
        const cls = ['tl-mod-card', mod.candidate ? 'is-candidate' : ''].filter(Boolean).join(' ');
        const accent = mod.accent || '#64748b';
        const programBar = mod.programColor
          ? `<div class="tl-mod-program-bar" style="background:${attr(mod.programColor)}"></div>`
          : '';
        const pills = mod.pills || [];
        const pillRows = groupPillsForRows(pills);
        const pillsHtml = pillRows.map(row => {
          const items = row.map(p => {
            let pcls = 'tl-pill';
            if (p.variant === 'solid') pcls += ' tl-pill-credits';
            if (p.variant === 'status') pcls += ' tl-pill-status';
            if ((p.variant || '').startsWith('program-')) pcls += ' tl-pill-program tl-pill-' + p.variant;
            const pstyle = (p.variant === 'status' && p.color) ? ` style="color:${attr(p.color)}"` :
                           ((p.variant || '').startsWith('program-') && p.color) ? ` style="color:${attr(p.color)}"` : '';
            return `<span class="${pcls}"${pstyle}>${esc(p.label)}</span>`;
          }).join('');
          return `<div class="tl-pill-row">${items}</div>`;
        }).join('');
        return `
          <div class="${cls}" tabindex="0" draggable="true" data-module-id="${attr(mod.moduleId || mod.id)}">
            ${programBar}
            <div class="tl-mod-accent" style="background:${accent}"></div>
            <div class="tl-mod-title">${esc(mod.name)}</div><details class="tl-mod-actions"><summary>Actions</summary><button type="button" class="tl-mod-open" data-open-module="${attr(mod.moduleId || mod.id)}">Open module</button>
            <select aria-label="Move ${attr(mod.name)} to semester" data-shelf-move="${attr(mod.moduleId || mod.id)}"><option value="">Move to semester…</option>${(boardData.terms || []).map(term => `<option value="${attr(term.label)}"${canPlace(mod,term.label) ? '' : ' disabled'}>${esc(term.label)}</option>`).join('')}</select></details>
            <div class="tl-mod-subtitle">${esc(mod.area)}</div>
            <div class="tl-mod-meta">${pillsHtml}</div>
          </div>
        `;
      }

      function renderShelfToParent() {
        if (boardData.planningMode === false) { cleanupParentShelf(); shelfOpen = false; return; }
        if (!ensureParentShelf() || !parentShelfContainer) return;

        const allCount = (boardData.candidateShelf || []).length;
        const allCredits = Math.round((boardData.summary || {}).candidateShelfCredits || 0);
        const displayed = filteredShelfModules();

        const content = displayed.length
          ? displayed.map(m => renderShelfModule(m)).join('')
          : `<div class="tl-shelf-empty">No candidates${shelfFilter !== 'all' ? ' matching this filter' : ''}.<br>Drag modules here or right-click → Move to Candidate Shelf.</div>`;

        const filterBtns = ['all', 'ws', 'ss'].map(f => {
          const labels = { all: 'All', ws: 'WS', ss: 'SS' };
          const active = shelfFilter === f ? ' is-active' : '';
          return `<button type="button" class="tl-shelf-filter-btn${active}" data-tl-shelf-filter="${f}">${labels[f]}</button>`;
        }).join('');

        parentShelfContainer.innerHTML = `
          <button type="button" aria-label="Open candidate shelf" class="tl-shelf-toggle" id="tl-shelf-toggle" style="${shelfOpen ? 'display:none' : ''}">
            <span class="tl-shelf-toggle-count">${allCount}</span>
            <span class="tl-shelf-toggle-text">Candidates</span>
          </button>
          <div class="tl-shelf-backdrop${shelfOpen ? ' is-visible' : ''}" id="tl-shelf-backdrop"></div>
          <div class="tl-shelf-drawer${shelfOpen ? ' is-open' : ''}" id="tl-shelf-drawer">
            <div class="tl-shelf-header">
              <div class="tl-shelf-header-top">
                <div class="tl-shelf-title">Candidate Courses</div>
                <button type="button" class="tl-shelf-close-btn" id="tl-shelf-close" aria-label="Close shelf">✕</button>
              </div>
              <div class="tl-shelf-stats">
                <span><b>${allCount}</b> modules</span>
                <span><b>${allCredits}</b> LP</span>
              </div>
              <div class="tl-shelf-filter">${filterBtns}</div>
            </div>
            <div class="tl-shelf-body">
              <div class="tl-shelf-dropzone" id="tl-shelf-dropzone" data-dropzone="candidate-shelf">
                ${content}
              </div>
            </div>
          </div>
        `;

        bindParentShelfInteractions();
      }

      function bindParentShelfInteractions() {
        if (!parentShelfContainer) return;
        const pdoc = window.parent.document;

        pdoc.querySelectorAll('[data-open-module]').forEach(button => {
          button.onclick = () => dispatchAction('open_details', {module_id:button.dataset.openModule});
        });
        pdoc.querySelectorAll('[data-shelf-move]').forEach(select => {
          select.onchange = () => {
            const mod = moduleIndex[select.dataset.shelfMove];
            if (select.value && canPlace(mod, select.value)) dispatchAction('move_term', {module_id:mod.moduleId || mod.id,term:select.value});
          };
        });
        const toggle = pdoc.getElementById('tl-shelf-toggle');
        if (toggle) {
          toggle.onclick = () => { openShelf(); };
          toggle.addEventListener('dragover', e => {
            e.preventDefault();
            toggle.style.background = 'rgba(29,78,216,0.10)';
            e.dataTransfer.dropEffect = 'move';
          });
          toggle.addEventListener('dragleave', () => {
            toggle.style.background = '';
          });
          toggle.addEventListener('drop', e => {
            e.preventDefault();
            toggle.style.background = '';
            const segmentId = draggedModuleId || e.dataTransfer.getData('text/plain');
            const mod = moduleIndex[segmentId];
            if (mod) dispatchAction('move_to_candidate_pool', { module_id: mod.moduleId || mod.id });
          });
        }

        const backdrop = pdoc.getElementById('tl-shelf-backdrop');
        if (backdrop) {
          backdrop.onclick = () => { closeShelf(); };

          // ── Proxy: shelf card drag over backdrop → find term-dropzone in iframe ──
          backdrop.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            // Highlight the term-dropzone under the cursor
            const zone = findTermDropzoneAtParentCoords(e.clientX, e.clientY);
            clearDropzoneState();
            if (zone) {
              const mod = moduleIndex[draggedModuleId];
              if (canPlace(mod, zone.dataset.term)) {
                zone.classList.add('is-active-valid');
              } else {
                zone.classList.add('is-active-invalid');
              }
            }
          });
          backdrop.addEventListener('dragleave', () => {
            clearDropzoneState();
          });
          backdrop.addEventListener('drop', e => {
            e.preventDefault();
            clearDropzoneState();
            const zone = findTermDropzoneAtParentCoords(e.clientX, e.clientY);
            if (zone) {
              const segmentId = draggedModuleId || e.dataTransfer.getData('text/plain');
              const mod = moduleIndex[segmentId];
              const term = zone.dataset.term;
              if (mod && term && canPlace(mod, term)) {
                dispatchAction('move_term', { module_id: mod.moduleId || mod.id, term });
              }
            }
          });
        }

        const closeBtn = pdoc.getElementById('tl-shelf-close');
        if (closeBtn) closeBtn.onclick = () => { closeShelf(); };

        pdoc.querySelectorAll('[data-tl-shelf-filter]').forEach(btn => {
          btn.onclick = () => {
            shelfFilter = btn.getAttribute('data-tl-shelf-filter');
            renderShelfToParent();
          };
        });

        const sz = pdoc.getElementById('tl-shelf-dropzone');
        if (sz) {
          sz.addEventListener('dragover', e => {
            e.preventDefault();
            sz.classList.add('is-active-valid');
            e.dataTransfer.dropEffect = 'move';
          });
          sz.addEventListener('dragleave', e => {
            if (!sz.contains(e.relatedTarget)) sz.classList.remove('is-active-valid');
          });
          sz.addEventListener('drop', e => {
            e.preventDefault();
            sz.classList.remove('is-active-valid');
            const segmentId = draggedModuleId || e.dataTransfer.getData('text/plain');
            const mod = moduleIndex[segmentId];
            if (mod) dispatchAction('move_to_candidate_pool', { module_id: mod.moduleId || mod.id });
          });
        }

        // ── Proxy: shelf card drag over drawer body → find term-dropzone in iframe ──
        const drawerBody = pdoc.querySelector('.tl-shelf-body');
        if (drawerBody) {
          drawerBody.addEventListener('dragover', e => {
            // Allow dropping cards from iframe onto the drawer body area
            if (!e.target.closest('.tl-shelf-dropzone')) {
              e.preventDefault();
              e.dataTransfer.dropEffect = 'move';
            }
          });
        }

        pdoc.querySelectorAll('.tl-shelf-drawer .tl-mod-card').forEach(card => {
          card.addEventListener('dragstart', e => {
            draggedModuleId = card.dataset.moduleId;
            card.style.opacity = '0.4';
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedModuleId || '');
          });
          card.addEventListener('dragend', () => {
            draggedModuleId = null;
            card.style.opacity = '';
            clearDropzoneState();
          });
          card.addEventListener('contextmenu', e => {
            // Close shelf so the context menu (in iframe) is visible
            shelfOpen = false;
            renderShelfToParent();
            openContextMenu(e, card.dataset.moduleId);
          });
          card.addEventListener('dblclick', () => {
            dispatchAction('open_details', { module_id: card.dataset.moduleId });
          });
        });
      }

      /* ── Render: full board ────────────────────────── */
      function renderBoard() {
        const expandedModules = new Set(Array.from(root.querySelectorAll('.module-card:has(details[open])')).map(card => card.dataset.segmentId));
        moduleIndex = {};
        (boardData.terms || []).forEach(t => {
          (t.modules || []).forEach(m => { moduleIndex[m.id] = m; });
        });
        (boardData.candidateShelf || []).forEach(m => { moduleIndex[m.id] = m; });

        root.innerHTML = `
          <div class="board-wrapper">
            <div class="board-layout">
              <div class="lanes-area">
                ${(boardData.terms || []).map(renderTerm).join('')}
              </div>
            </div>
            ${boardData.planningMode ? `<div class="shelf-drop-edge" id="shelf-drop-edge">
              <span class="shelf-drop-edge-label">→ Shelf</span>
            </div>` : ''}
          </div>
        `;

        renderShelfToParent();
        root.querySelectorAll('.module-card').forEach(card => {
          if (expandedModules.has(card.dataset.segmentId)) card.querySelector('details')?.setAttribute('open', '');
        });
        bindInteractions();
        updateHeight();
      }

      /* ── Context menu ──────────────────────────────── */
      function hideContextMenu() {
        contextMenu.hidden = true;
        contextMenu.innerHTML = "";
        requestAnimationFrame(updateHeight);
      }

      function dispatchAction(kind, payload) {
        hideContextMenu();
        setComponentValue(makeAction(kind, payload));
      }

      function openContextMenu(event, moduleId) {
        const mod = moduleIndex[moduleId];
        if (!mod) return;
        event.preventDefault();
        event.stopPropagation();

        const stateButtons = (boardData.states || []).map(state => `
          <button type="button"
            class="context-button${state === mod.state ? " is-current" : ""}" aria-pressed="${state === mod.state}"
            data-kind="set_state" data-module-id="${attr(mod.moduleId || mod.id)}" data-value="${attr(state)}">
            <span>${esc(state)}</span>
            <span class="context-secondary">${state === mod.state ? "Current" : ""}</span>
          </button>
        `).join("");

        contextMenu.innerHTML = `
          <div class="context-heading"><strong>Course actions</strong><button type="button" class="context-close" aria-label="Close course actions">×</button></div>
          <div class="context-course-name">${esc(mod.name)}</div>
          <button type="button" class="context-button context-open" data-kind="open_details" data-module-id="${attr(mod.moduleId || mod.id)}"><span>Open module details</span><span aria-hidden="true">↗</span></button>
          <div class="context-divider"></div>
          <div class="context-title">Status</div><div class="context-status-grid">${stateButtons}</div>
          ${mod.draggable === false ? '' : `<label class="context-title" for="move-semester">Move to semester</label>
          <select id="move-semester" aria-label="Move to semester"><option value="">Choose semester…</option>${(boardData.terms || []).map(term => `<option value="${attr(term.label)}"${canPlace(mod, term.label) ? '' : ' disabled'}>${esc(term.label)}</option>`).join('')}</select>`}
          <label class="context-title" for="change-area">Area</label>
          <select id="change-area" aria-label="Change area">${(mod.areaOptions || []).map(area => `<option value="${attr(area)}"${area === mod.area ? ' selected' : ''}>${esc(area)}</option>`).join('')}</select>
          <div class="context-divider"></div>
          <button type="button" class="context-button" data-kind="move_to_candidate_pool" data-module-id="${attr(mod.moduleId || mod.id)}"><span>Move to candidate shelf</span></button>
        `;
        contextMenu.querySelector('.context-close').addEventListener('click', hideContextMenu);
        contextMenu.querySelector('#change-area').addEventListener('change', e => {
          dispatchAction('set_area', {module_id:mod.moduleId || mod.id, area:e.target.value});
        });
        contextMenu.hidden = false;
        contextMenu.querySelector('#move-semester')?.addEventListener('change', e => {
          if (e.target.value && canPlace(mod, e.target.value)) dispatchAction('move_term', {module_id:mod.moduleId || mod.id, term:e.target.value});
        });

        // Determine cursor position in iframe viewport coordinates.
        // If the event originates from the parent document (e.g. shelf cards),
        // we need to translate parent-viewport coords to iframe coords.
        let cx = event.clientX;
        let cy = event.clientY;
        try {
          const evtDoc = event.target && event.target.ownerDocument;
          if (evtDoc && evtDoc !== document && window.frameElement) {
            const iframeRect = window.frameElement.getBoundingClientRect();
            cx = event.clientX - iframeRect.left;
            cy = event.clientY - iframeRect.top;
          }
        } catch (e) { /* cross-origin */ }

        contextMenu.style.maxHeight = `${Math.min(480, window.parent.innerHeight - 100)}px`;
        const mw = contextMenu.offsetWidth || 230;
        const mh = contextMenu.offsetHeight || 200;
        // Clamp to iframe content area
        const maxX = Math.max(document.documentElement.clientWidth, root.scrollWidth) - mw - 16;
        const frameTop = window.frameElement?.getBoundingClientRect().top || 0;
        const minY = Math.max(8, -frameTop + 64);
        const maxY = Math.max(minY, window.parent.innerHeight - frameTop - mh - 16);
        contextMenu.style.left = `${Math.max(8, Math.min(cx, maxX))}px`;
        contextMenu.style.top = `${Math.max(minY, Math.min(cy, maxY))}px`;

        contextMenu.querySelectorAll("[data-kind]").forEach(btn => {
          btn.addEventListener("click", e => {
            e.stopPropagation();
            const payload = { module_id: btn.dataset.moduleId };
            if (btn.dataset.value) {
              if (btn.dataset.kind === "set_state") payload.state = btn.dataset.value;
              if (btn.dataset.kind === "set_area") payload.area = btn.dataset.value;
            }
            dispatchAction(btn.dataset.kind, payload);
          });
        });

        contextMenu.querySelector('.context-open')?.focus();
        requestAnimationFrame(updateHeight);
      }

      /* ── Drag & drop ───────────────────────────────── */
      function clearDropzoneState() {
        root.querySelectorAll(".term-dropzone").forEach(z => {
          z.classList.remove("is-active-valid", "is-active-invalid");
        });
      }

      /**
       * Translate parent-viewport coordinates to iframe content coords
       * and find the .term-dropzone at that point.
       */
      function findTermDropzoneAtParentCoords(clientX, clientY) {
        try {
          const iframeEl = window.frameElement;
          if (!iframeEl) return null;
          const rect = iframeEl.getBoundingClientRect();
          const x = clientX - rect.left;
          const y = clientY - rect.top;
          // Iterate dropzones and check bounding rects (more reliable than elementFromPoint
          // across scrolling contexts)
          const zones = root.querySelectorAll('.term-dropzone');
          for (const zone of zones) {
            const zr = zone.getBoundingClientRect();
            if (x >= zr.left && x <= zr.right && y >= zr.top && y <= zr.bottom) {
              return zone;
            }
          }
        } catch (e) { /* cross-origin fallback */ }
        return null;
      }

      function bindDragForCard(card) {
        card.querySelector('.module-menu-hint')?.addEventListener('click', e => {
          openContextMenu(e, card.dataset.segmentId || card.dataset.moduleId);
        });
        card.addEventListener('keydown', e => {
          if (e.target !== card) return;
          if (e.key === 'Enter') dispatchAction('open_details', {module_id:card.dataset.moduleId});
          if (e.key === ' ' || (e.shiftKey && e.key === 'F10')) {
            const rect = card.getBoundingClientRect();
            e.preventDefault();
            openContextMenu({preventDefault(){},stopPropagation(){},target:card,clientX:rect.right-30,clientY:rect.top+30}, card.dataset.segmentId || card.dataset.moduleId);
          }
        });
        if (card.getAttribute("draggable") === "true") {
          card.addEventListener("dragstart", e => {
            draggedModuleId = card.dataset.segmentId || card.dataset.moduleId;
            card.classList.add("is-dragging");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", draggedModuleId || "");
            hideContextMenu();
            clearDropzoneState();
            // Show the shelf drop edge indicator
            const edge = document.getElementById('shelf-drop-edge');
            if (edge) edge.style.pointerEvents = 'auto';
          });

          card.addEventListener("dragend", () => {
            draggedModuleId = null;
            card.classList.remove("is-dragging");
            clearDropzoneState();
            // Hide shelf drop edge
            const edge = document.getElementById('shelf-drop-edge');
            if (edge) {
              edge.classList.remove('is-drag-hover');
              edge.style.pointerEvents = '';
            }
          });
        }

        card.addEventListener("dblclick", () => {
          dispatchAction("open_details", { module_id: card.dataset.moduleId });
        });

        card.addEventListener("contextmenu", e => {
          openContextMenu(e, card.dataset.segmentId || card.dataset.moduleId);
        });
      }

      function bindTermDropzone(zone) {
        zone.addEventListener("dragover", e => {
          e.preventDefault();
          const mod = moduleIndex[draggedModuleId];
          clearDropzoneState();
          if (canPlace(mod, zone.dataset.term)) {
            zone.classList.add("is-active-valid");
            e.dataTransfer.dropEffect = "move";
          } else {
            zone.classList.add("is-active-invalid");
            e.dataTransfer.dropEffect = "none";
          }
        });

        zone.addEventListener("dragenter", e => {
          e.preventDefault();
          const mod = moduleIndex[draggedModuleId];
          if (canPlace(mod, zone.dataset.term)) {
            zone.classList.add("is-active-valid");
          } else {
            zone.classList.add("is-active-invalid");
          }
        });

        zone.addEventListener("dragleave", e => {
          if (!zone.contains(e.relatedTarget)) {
            zone.classList.remove("is-active-valid", "is-active-invalid");
          }
        });

        zone.addEventListener("drop", e => {
          e.preventDefault();
          const segmentId = draggedModuleId || e.dataTransfer.getData("text/plain");
          const mod = moduleIndex[segmentId];
          const term = zone.dataset.term;
          zone.classList.remove("is-active-valid", "is-active-invalid");
          if (!mod || !term) return;
          if (!canPlace(mod, term)) {
            dispatchAction("invalid_term_drop", { module_id: mod.moduleId || mod.id, term });
            return;
          }
          if (mod.term === term && mod.draggable !== false) return;
          dispatchAction("move_term", { module_id: mod.moduleId || mod.id, term });
        });
      }

      function bindShelfDropEdge(edge) {
        edge.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          edge.classList.add('is-drag-hover');
        });
        edge.addEventListener('dragenter', e => {
          e.preventDefault();
          edge.classList.add('is-drag-hover');
        });
        edge.addEventListener('dragleave', e => {
          if (!edge.contains(e.relatedTarget)) {
            edge.classList.remove('is-drag-hover');
          }
        });
        edge.addEventListener('drop', e => {
          e.preventDefault();
          edge.classList.remove('is-drag-hover');
          const segmentId = draggedModuleId || e.dataTransfer.getData('text/plain');
          const mod = moduleIndex[segmentId];
          if (mod) {
            dispatchAction('move_to_candidate_pool', { module_id: mod.moduleId || mod.id });
          }
        });
      }

      /* ── Interaction bindings ──────────────────────── */
      function closeShelf() {
        shelfOpen = false;
        renderShelfToParent();
      }

      function openShelf() {
        shelfOpen = true;
        renderShelfToParent();
      }

      function bindInteractions() {
        root.querySelectorAll('details').forEach(detail => detail.addEventListener('toggle', () => {
          updateHeight();
        }));
        root.querySelectorAll(".module-card").forEach(bindDragForCard);
        root.querySelectorAll(".term-dropzone").forEach(bindTermDropzone);
        root.querySelectorAll("[data-term-action]").forEach(btn => {
          btn.addEventListener("click", e => {
            e.stopPropagation();
            const term = btn.dataset.term;
            const kind = btn.dataset.termAction;
            if (!term || !kind) return;
            if (kind === "rename") {
              const value = window.prompt("Rename semester", term);
              if (value && value.trim()) {
                dispatchAction("rename_term", { term, new_term: value.trim() });
              }
              return;
            }
            if (kind === "delete") {
              if (window.confirm(`Delete the empty semester ${term}?`)) {
                dispatchAction("delete_term", { term });
              }
            }
          });
        });
        const edge = document.getElementById('shelf-drop-edge');
        if (edge) bindShelfDropEdge(edge);
      }

      window.addEventListener('beforeunload', cleanupParentShelf);
      window.addEventListener('unload', cleanupParentShelf);

      let lastBoardSignature = '';
      window.addEventListener("message", event => {
        if (event.data.type !== "streamlit:render") return;
        syncTheme();
        const incoming = event.data.args.board || { terms: [], candidateShelf: [], states: [], summary: {} };
        const signature = JSON.stringify(incoming);
        if (signature === lastBoardSignature) return;
        lastBoardSignature = signature;
        boardData = incoming;
        hideContextMenu();
        renderBoard();
      });

      window.addEventListener("resize", updateHeight);
      window.addEventListener("load", init);
      document.addEventListener("click", event => {
        if (!contextMenu.contains(event.target)) hideContextMenu();
      });
      // Also dismiss context menu on parent document clicks
      try { window.parent.document.addEventListener("click", event => {
        if (!contextMenu.contains(event.target)) hideContextMenu();
      }); } catch(e) {}
      document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          hideContextMenu();
          if (shelfOpen) closeShelf();
        }
      });
    </script>
  </body>
</html>
